<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}HLD Academy{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">»</span>
        <span class="brand-text">HLD Academy</span>
    </a>

    <nav class="topbar-nav">
        <a href="{{ url_for('index') }}">Library</a>
        <a href="{{ url_for('markdown_guide') }}">Markdown Guide</a>
        <a class="btn btn-primary" href="{{ url_for('new_problem') }}">+ New Problem</a>
    </nav>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
